name: Module check (temporary)
on:
  push:
    branches: [fix/liquidity-sector-flow]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python liquidity_tracker.py
      - run: python sector_flow.py
